$kind: http-request
url: "{{utilisateursUrl}}/api/users"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"nom": "Sara Etudiante {{runId}}", "email": "etudiant{{runId}}@emsi.ma", "role": "ETUDIANT", "actif": true}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", () => pm.response.to.have.status(201));
      pm.test("Ressource creee", () => { pm.expect(pm.response.json().id).to.be.above(0); pm.response.to.have.header("Location"); });
      pm.collectionVariables.set("etudiantId", pm.response.json().id);
    language: text/javascript
order: 27000
