$kind: http-request
url: "{{planningUrl}}/api/cours"
method: POST
headers:
  Content-Type: application/json
  idempotencyKey: "{{coursIdempotencyKey}}"
body:
  type: json
  content: '{"classeId": {{classeId}}, "enseignantId": {{enseignantId}}, "matiere": "Maths", "dateHeure": "2026-11-02T09:00:00", "salle": "Salle {{runId}}"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 400", () => pm.response.to.have.status(400));
      pm.test("Operation deja traitee", () => pm.expect(pm.response.json().detail).to.eql("Opération déjà traitée"));
    language: text/javascript
order: 24000
