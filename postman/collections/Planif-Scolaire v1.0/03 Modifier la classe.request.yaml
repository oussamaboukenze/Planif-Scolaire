$kind: http-request
url: "{{referentielUrl}}/api/classes/{{classeId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"nom": "Classe {{runId}}", "niveau": "6e", "effectifMax": 32}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      pm.test("Modification", () => pm.expect(pm.response.json().effectifMax).to.eql(32));
    language: text/javascript
order: 3000
