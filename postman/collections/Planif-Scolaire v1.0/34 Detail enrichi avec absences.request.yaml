$kind: http-request
url: "{{planningUrl}}/api/cours/{{coursId}}/detail"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      pm.test("Classe, enseignant et absences", () => { const d = pm.response.json(); pm.expect(d.classe).to.exist; pm.expect(d.enseignant).to.exist; pm.expect(d.absences).to.be.an("array").that.is.not.empty; });
    language: text/javascript
order: 34000
