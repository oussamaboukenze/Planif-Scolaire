$kind: http-request
url: "{{referentielUrl}}/api/classes/{{classeId}}"
method: GET
headers:
  Content-Type: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      pm.test("Classe sauvegardee", () => pm.expect(pm.response.json().effectifMax).to.eql(30));
    language: text/javascript
order: 2000
