$kind: http-request
url: "{{planningUrl}}/api/cours/{{coursId}}/statut"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"statut": "REALISE"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      pm.test("Cours realise", () => pm.expect(pm.response.json().statut).to.eql("REALISE"));
    language: text/javascript
order: 17000
