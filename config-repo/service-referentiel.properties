server.port=8081
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/service-referentiel}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
# Données de démo (ids 1001+) : seed-demo.sql (rechargées à chaque démarrage). Pour les désactiver : APP_SEED_LOCATION=optional:classpath:aucun.sql
spring.sql.init.data-locations=optional:classpath:data.sql,${APP_SEED_LOCATION:optional:classpath:seed-demo.sql}
