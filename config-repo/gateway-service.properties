server.port=8080
# Routage DYNAMIQUE : chaque service Eureka est accessible via /<nom-du-service>/**
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true
# Routes STATIQUES (URLs propres /api/... + rate limiter) : elles restent prioritaires

spring.cloud.gateway.server.webflux.routes[0].id=service-referentiel
spring.cloud.gateway.server.webflux.routes[0].uri=lb://service-referentiel
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/classes/**,/api/enseignants/**
spring.cloud.gateway.server.webflux.routes[0].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[0].filters[0].args[redis-rate-limiter.replenishRate]=5
spring.cloud.gateway.server.webflux.routes[0].filters[0].args[redis-rate-limiter.burstCapacity]=10
spring.cloud.gateway.server.webflux.routes[0].filters[0].args[redis-rate-limiter.requestedTokens]=1
spring.cloud.gateway.server.webflux.routes[0].filters[0].args[key-resolver]=#{@clientKeyResolver}

spring.cloud.gateway.server.webflux.routes[1].id=service-planning
spring.cloud.gateway.server.webflux.routes[1].uri=lb://service-planning
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/cours/**
spring.cloud.gateway.server.webflux.routes[1].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[1].filters[0].args[redis-rate-limiter.replenishRate]=5
spring.cloud.gateway.server.webflux.routes[1].filters[0].args[redis-rate-limiter.burstCapacity]=10
spring.cloud.gateway.server.webflux.routes[1].filters[0].args[redis-rate-limiter.requestedTokens]=1
spring.cloud.gateway.server.webflux.routes[1].filters[0].args[key-resolver]=#{@clientKeyResolver}

