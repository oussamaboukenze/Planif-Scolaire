server.port=8080
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false

spring.cloud.gateway.server.webflux.routes[0].id=service-referentiel
spring.cloud.gateway.server.webflux.routes[0].uri=lb://service-referentiel
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/classes/**,/api/enseignants/**
spring.cloud.gateway.server.webflux.routes[0].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[0].filters[0].args[redis-rate-limiter.replenishRate]=5
spring.cloud.gateway.server.webflux.routes[0].filters[0].args[redis-rate-limiter.burstCapacity]=10
spring.cloud.gateway.server.webflux.routes[0].filters[0].args[redis-rate-limiter.requestedTokens]=1
spring.cloud.gateway.server.webflux.routes[0].filters[0].args[key-resolver]=#{@clientKeyResolver}

spring.cloud.gateway.server.webflux.routes[1].id=service-planning
spring.cloud.gateway.server.webflux.routes[1].uri=lb://service-planning
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/cours/**
spring.cloud.gateway.server.webflux.routes[1].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[1].filters[0].args[redis-rate-limiter.replenishRate]=5
spring.cloud.gateway.server.webflux.routes[1].filters[0].args[redis-rate-limiter.burstCapacity]=10
spring.cloud.gateway.server.webflux.routes[1].filters[0].args[redis-rate-limiter.requestedTokens]=1
spring.cloud.gateway.server.webflux.routes[1].filters[0].args[key-resolver]=#{@clientKeyResolver}

spring.cloud.gateway.server.webflux.routes[2].id=service-presences
spring.cloud.gateway.server.webflux.routes[2].uri=lb://service-presences
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/appels/**
spring.cloud.gateway.server.webflux.routes[2].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[2].filters[0].args[redis-rate-limiter.replenishRate]=5
spring.cloud.gateway.server.webflux.routes[2].filters[0].args[redis-rate-limiter.burstCapacity]=10
spring.cloud.gateway.server.webflux.routes[2].filters[0].args[redis-rate-limiter.requestedTokens]=1
spring.cloud.gateway.server.webflux.routes[2].filters[0].args[key-resolver]=#{@clientKeyResolver}

spring.cloud.gateway.server.webflux.routes[3].id=notification-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://notification-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/notifications/**
spring.cloud.gateway.server.webflux.routes[3].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[3].filters[0].args[redis-rate-limiter.replenishRate]=5
spring.cloud.gateway.server.webflux.routes[3].filters[0].args[redis-rate-limiter.burstCapacity]=10
spring.cloud.gateway.server.webflux.routes[3].filters[0].args[redis-rate-limiter.requestedTokens]=1
spring.cloud.gateway.server.webflux.routes[3].filters[0].args[key-resolver]=#{@clientKeyResolver}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
