server.port=8083
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/service-presences}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=service-presences
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.listener.ack-mode=record
spring.cloud.openfeign.client.config.default.connectTimeout=2000
spring.cloud.openfeign.client.config.default.readTimeout=3000
resilience4j.circuitbreaker.instances.planningCours.slidingWindowSize=5
resilience4j.circuitbreaker.instances.planningCours.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.planningCours.failureRateThreshold=50
resilience4j.circuitbreaker.instances.planningCours.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.planningCours.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.planningCours.recordExceptions[0]=feign.RetryableException
resilience4j.circuitbreaker.instances.planningCours.recordExceptions[1]=feign.FeignException$InternalServerError
resilience4j.circuitbreaker.instances.planningCours.recordExceptions[2]=feign.FeignException$BadGateway
resilience4j.circuitbreaker.instances.planningCours.recordExceptions[3]=feign.FeignException$ServiceUnavailable
resilience4j.circuitbreaker.instances.planningCours.recordExceptions[4]=feign.FeignException$GatewayTimeout
resilience4j.retry.instances.planningCours.maxAttempts=3
resilience4j.retry.instances.planningCours.waitDuration=250ms
resilience4j.retry.instances.planningCours.retryExceptions[0]=feign.RetryableException
resilience4j.retry.instances.planningCours.retryExceptions[1]=feign.FeignException$InternalServerError
resilience4j.retry.instances.planningCours.retryExceptions[2]=feign.FeignException$BadGateway
resilience4j.retry.instances.planningCours.retryExceptions[3]=feign.FeignException$ServiceUnavailable
resilience4j.retry.instances.planningCours.retryExceptions[4]=feign.FeignException$GatewayTimeout
app.referentiel-url=${REFERENTIEL_URL:http://localhost:8081}
app.planning-url=${PLANNING_URL:http://localhost:8082}

management.endpoints.web.exposure.include=health,info,metrics
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
